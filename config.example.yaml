# xquare Control Tower SSH - relay server configuration
relay:
  ssh_host: 0.0.0.0
  ssh_port: 2222
  ws_host: 0.0.0.0
  ws_port: 8765
  ws_path: /agent
  # ed25519 host key; generated on first start if missing
  host_key: data/relay_host_key
  # optional public-key auth file for operators (one key per line)
  authorized_keys: data/authorized_keys
  # DANGER: allow any username/password. Keep false in production.
  allow_anonymous: false
  default_term: xterm-256color
  open_timeout: 15
  auth_timeout: 30
  # host/IP placed in generated install URLs; empty = use the address the
  # operator connected to
  advertise_host: ""
  # agent tarball served at /agent.tar.gz
  agent_package: agent-dist.tar.gz

  # --- TLS for the agent WebSocket (optional; relay/setup.sh --domain) ------
  # A TLS terminator (Caddy) fronts only the agent WebSocket on a public port
  # (443 for a public ACME cert).  When `tls: true` the Python server binds to
  # `ws_bind_host`/`ws_bind_port` while `ws_host`/`ws_port` stay the public
  # endpoint, and generated agent commands use wss://.  The install web server
  # below is NOT TLS-terminated and stays plain http.
  # tls: true
  # tls_verify: false      # false = agents skip cert verification (internal CA)
  # tls_ca_file: /etc/xquare-ct-ssh/caddy-root.crt   # served at /ca.crt
  # ws_bind_host: 127.0.0.1
  # ws_bind_port: 18765

# Install web server: serves the agent package and one-line installers.
# `add-server` in the C2 CLI prints a `curl ... | sudo bash` link served here.
# Always plain http; it is never proxied through the TLS terminator.
web:
  web_enabled: true
  web_host: 0.0.0.0
  web_port: 1234

database:
  path: data/relay.db

logging:
  level: INFO
